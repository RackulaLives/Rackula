# Docker Compose override for persistent storage
# Usage: docker compose -f docker-compose.yml -f docker-compose.persist.yml up -d

services:
  rackula:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_PERSIST_ENABLED: "true"
    depends_on:
      rackula-api:
        condition: service_healthy

  rackula-api:
    image: ghcr.io/rackulalives/rackula-api:latest
    container_name: rackula-api
    restart: unless-stopped
    stop_grace_period: 10s

    volumes:
      - ./data:/data

    environment:
      - DATA_DIR=/data
      - PORT=3001

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=5M

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    expose:
      - "3001"
