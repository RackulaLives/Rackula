name: Deploy Dev

# Publishes main to d.racku.la: the rackula-dev Cloudflare Worker
# (api/wrangler.jsonc) serves the SPA as static assets and the persistence API
# on /api/*, behind the existing Cloudflare Access app (#2134). Tests are not
# re-run here; they gate the PR before merge.
#
# Deploy order, mirroring deploy-prod.yml so a bad build never takes traffic:
#   1. build main, generate the CF-only artifacts, write server-mode config.js
#   2. `wrangler versions upload`  -> a per-version preview URL, no traffic
#   3. curl smoke against the preview URL (smoke-headers.sh --surface dev)
#   4. `wrangler versions deploy`  -> shifts 100% of dev traffic
#   5. `wrangler triggers deploy`  -> applies the d.racku.la route
#   6. browser smoke against d.racku.la through Cloudflare Access
#
# Rollback: from api/, `wrangler versions deploy <previous-version-id>@100% --yes`.
# Each run's summary records the version id it promoted.

on:
  push:
    branches: [main]
    # Globs must be `dir/**` to match files inside a directory; a bare `dir/`
    # matches nothing, which silently disabled push deploys (#1924). Cover every
    # input to the SPA build, the Worker bundle, and this deploy path.
    paths:
      - api/**
      - src/**
      - assets/**
      - static/**
      - login.html
      - index.html
      - package.json
      - package-lock.json
      - vite.config.*
      - svelte.config.*
      - tsconfig*.json
      - scripts/gen-headers.mjs
      - scripts/smoke-headers.sh
      - e2e/deploy-smoke.spec.ts
      - e2e/playwright.smoke.config.ts
      - .github/workflows/deploy-dev.yml
      # Skip docs-only deploys. The dir globs above match every file in a
      # directory, so a README inside api/ would otherwise trigger a deploy.
      # This negation (evaluated after the positives) drops markdown anywhere.
      # Mixed code+markdown commits still match a positive path and deploy.
      - "!**/*.md"
  workflow_dispatch:

# Serialize dev deploys. A newer push queues behind a running deploy instead of
# cancelling it mid-promotion.
concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: dev
      url: https://d.racku.la
    permissions:
      contents: read

    steps:
      # fetch-depth 0 so vite's getGitInfo() populates version.json.commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"

      - name: Install dependencies
        run: npm ci

      # The Worker bundle (api/src/worker.ts) and wrangler itself come from the
      # API's lockfile, so Dependabot's wrangler bumps apply to this deploy.
      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Resolve build identity
        id: build
        # Short commit, matching what vite writes into version.json.
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build dev bundle
        env:
          VITE_ENV: development
        run: npm run build

      - name: Generate Cloudflare-only artifacts
        # Emitted into dist/ here and never committed to static/: publicDir
        # copies static/ verbatim into EVERY dist, including the self-host
        # images. config.js matches what the Docker dev entrypoint wrote.
        run: |
          set -euo pipefail
          node scripts/gen-headers.mjs dev --out dist/_headers
          node scripts/gen-headers.mjs --assetsignore dist/.assetsignore
          printf 'window.__RACKULA_CONFIG__ = { storage: "server", env: "dev" };\n' > dist/config.js
          echo "--- dist/_headers ---"
          cat dist/_headers

      - name: Strip login.html from the dev artifact
        # Dev runs AUTH_MODE=none behind Cloudflare Access, so there is no login
        # backend; same reasoning as deploy-prod.yml. Afterwards /login resolves
        # to the SPA shell.
        run: |
          test -f dist/login.html || { echo "::error::dist/login.html missing - the self-host artifact would be broken"; exit 1; }
          rm -f dist/login.html

      - name: Assert artifact integrity before upload
        env:
          EXPECTED_VERSION: ${{ steps.build.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          set -euo pipefail
          grep -q 'storage: *"server"' dist/config.js \
            || { echo "::error::dist/config.js is not in server storage mode"; exit 1; }
          grep -q "\"version\": *\"${EXPECTED_VERSION}\"" dist/version.json \
            || { echo "::error::version.json != ${EXPECTED_VERSION}"; cat dist/version.json; exit 1; }
          grep -q "\"commit\": *\"${EXPECTED_COMMIT}\"" dist/version.json \
            || { echo "::error::version.json commit != ${EXPECTED_COMMIT}"; cat dist/version.json; exit 1; }
          echo "artifact OK: ${EXPECTED_VERSION} @ ${EXPECTED_COMMIT}"

      - name: Upload version (no traffic)
        id: upload
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
        # APP_VERSION and APP_COMMIT feed /api/version, so the API reports the
        # same build as version.json.
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler versions upload \
            --var "APP_VERSION:${BUILD_VERSION}" \
            --var "APP_COMMIT:${BUILD_COMMIT}" 2>&1 | tee upload.log
          version_id="$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | tail -1 | awk '{print $NF}')"
          preview_url="$(grep -oE 'Version Preview URL: https://[^[:space:]]+' upload.log | tail -1 | awk '{print $NF}')"
          [ -n "$version_id" ] || { echo "::error::could not parse Worker Version ID"; exit 1; }
          [ -n "$preview_url" ] || { echo "::error::could not parse Version Preview URL (is preview_urls enabled?)"; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "uploaded $version_id -> $preview_url"

      # The preview URL is on workers.dev, outside the racku.la zone, so curl is
      # not challenged there. It is also outside Cloudflare Access, which is why
      # --surface dev expects /api/layouts to answer 401: the API fails closed.
      - name: Smoke headers, content types and API fail-closed on the preview URL
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          scripts/smoke-headers.sh "$PREVIEW_URL" \
            --surface dev \
            --expect-version "$BUILD_VERSION" \
            --expect-commit "$BUILD_COMMIT"

      # Everything above is fail-closed. Only now does traffic move.
      - name: Promote version to 100% of traffic
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: ./node_modules/.bin/wrangler versions deploy "${VERSION_ID}@100%" --yes

      # `versions deploy` does not apply trigger changes. This lands the
      # d.racku.la route from api/wrangler.jsonc, and any later edit to it.
      - name: Apply triggers (routes)
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler triggers deploy

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-chromium-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # d.racku.la is inside the zone, so CI is challenged there, and it sits
      # behind Access. Chromium solves the challenge, and the service-token
      # headers from playwright.smoke.config.ts get it through Access (#2346).
      # EXPECT_SERVER_API adds the /api/layouts round trip through Access.
      - name: Verify d.racku.la in a browser
        env:
          SMOKE_TEST_URL: https://d.racku.la
          EXPECT_VERSION: ${{ steps.build.outputs.version }}
          EXPECT_COMMIT: ${{ steps.build.outputs.commit }}
          EXPECT_SERVER_API: "1"
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: deploy-dev-smoke-report
          path: playwright-report/
          retention-days: 7

      - name: Record the deployed version
        if: always()
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          {
            echo "### Dev deploy"
            echo ""
            echo "- build: \`${BUILD_VERSION}\` @ \`${BUILD_COMMIT}\`"
            echo "- Worker version id: \`${VERSION_ID}\`"
            echo "- preview: ${PREVIEW_URL}"
            echo ""
            echo "Rollback: from \`api/\`, run \`wrangler versions deploy <previous-version-id>@100% --yes\`."
          } >> "$GITHUB_STEP_SUMMARY"
