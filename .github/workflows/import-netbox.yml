name: Import NetBox Devices

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor name (case-sensitive, e.g., Ubiquiti, Dell, Synology)"
        required: true
        type: string
      slug:
        description: "Device slug to import (leave empty for all)"
        required: false
        type: string
      dry_run:
        description: "Dry run only (no changes)"
        required: false
        type: boolean
        default: true

# This is a rare, maintainer-dispatched workflow, so a single global group
# serialises every run regardless of vendor or slug, keeping raw inputs out
# of the concurrency key. cancel-in-progress is false: an in-flight import
# should finish (or fail on its own) rather than be cancelled by the next
# dispatch.
concurrency:
  group: import-netbox
  cancel-in-progress: false

# No default token permissions at the workflow level; the import job below
# declares exactly the two scopes it needs (contents: write, pull-requests:
# write) in its own permissions: block.
permissions: {}

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate inputs
        id: validate
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        run: |
          # Reject newline/CR so inputs cannot inject extra lines/commands, and enforce a
          # charset allowlist so shell metacharacters never reach the run: steps below,
          # mirroring build-lxc-dev.yml's "Validate label" step.
          case "$VENDOR" in
            *$'\n'*|*$'\r'*)
              echo "ERROR: vendor must not contain newline or CR characters"
              exit 1
              ;;
          esac
          case "$SLUG" in
            *$'\n'*|*$'\r'*)
              echo "ERROR: slug must not contain newline or CR characters"
              exit 1
              ;;
          esac

          # Vendor matches a NetBox devicetype-library folder name and is used
          # in the brand pack file name and a git branch name. The TypeScript
          # export name is sanitised separately (brandPackArrayName in
          # src/lib/utils/brand-pack-identifier.ts). Charset: letters, digits,
          # . _ -. It must start and end with a letter or digit, and must not
          # contain "..".
          VENDOR_RE='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
          if [[ ! "$VENDOR" =~ $VENDOR_RE ]]; then
            echo "ERROR: vendor '$VENDOR' is invalid: must start and end with a letter or digit, and contain only letters, digits, and . _ -"
            exit 1
          fi
          if [[ "$VENDOR" == *".."* ]]; then
            echo "ERROR: vendor '$VENDOR' is invalid: must not contain '..'"
            exit 1
          fi
          if [[ "${VENDOR,,}" == *.lock ]]; then
            echo "ERROR: vendor '$VENDOR' is invalid: must not end with '.lock' (case-insensitive), which git refs disallow"
            exit 1
          fi

          # Slug is a NetBox device slug: kebab-case, no spaces.
          SLUG_RE='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
          if [ -n "$SLUG" ]; then
            if [[ ! "$SLUG" =~ $SLUG_RE ]]; then
              echo "ERROR: slug '$SLUG' is invalid: must start and end with a letter or digit, and contain only letters, digits, and . _ -"
              exit 1
            fi
            if [[ "$SLUG" == *".."* ]]; then
              echo "ERROR: slug '$SLUG' is invalid: must not contain '..'"
              exit 1
            fi
            if [[ "${SLUG,,}" == *.lock ]]; then
              echo "ERROR: slug '$SLUG' is invalid: must not end with '.lock' (case-insensitive), which git refs disallow"
              exit 1
            fi
          fi

          # The branch identity must equal the import script's output identity:
          # two runs that write to the same brand pack file must land on the
          # same branch, so a real conflict surfaces as an ordinary git merge
          # conflict instead of two branches silently disagreeing about the
          # same file. scripts/import-netbox-devices.ts (brandPackFilePath)
          # writes to src/lib/data/brandPacks/<vendor.toLowerCase()>.ts, so
          # VENDOR_KEY reproduces that exact transform: lowercase only. The
          # vendor charset above never contains a space, so no further
          # encoding is needed to make it a valid git ref component.
          VENDOR_KEY=$(printf '%s' "$VENDOR" | tr '[:upper:]' '[:lower:]')

          # A dedicated path segment for the run kind keeps the branch
          # unambiguous: "all" (the literal --all run) can never collide with
          # "device-<slug>" (a single-device run), unlike a shared
          # "<vendor>-devices" suffix, which a device literally named
          # "devices" would also produce. The slug is used verbatim, not
          # lowercased or normalised, since it is already restricted to
          # [A-Za-z0-9._-], starts and ends alphanumeric, and (checked above)
          # has no ".." and no trailing ".lock". A single-device import
          # (--slug) gets its own branch per device; an --all import keeps
          # the vendor-level branch.
          if [ -n "$SLUG" ]; then
            BRANCH_NAME="${VENDOR_KEY}/device-${SLUG}"
          else
            BRANCH_NAME="${VENDOR_KEY}/all"
          fi
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        id: import
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--vendor "$VENDOR")

          if [ -n "$SLUG" ]; then
            ARGS+=(--slug "$SLUG")
          else
            ARGS+=(--all)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "Running: npx tsx scripts/import-netbox-devices.ts ${ARGS[*]}"
          npx tsx scripts/import-netbox-devices.ts "${ARGS[@]}"

      - name: Process images
        if: inputs.dry_run == false
        run: npm run process-images

      - name: Check for changes
        if: inputs.dry_run == false
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: inputs.dry_run == false && steps.changes.outputs.has_changes == 'true'
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(devices): import ${{ env.VENDOR }} devices from NetBox"
          title: "feat(devices): Import ${{ env.VENDOR }} devices from NetBox"
          body: |
            ## Summary
            Automated import of ${{ env.VENDOR }} devices from the NetBox devicetype-library.

            **Vendor:** ${{ env.VENDOR }}
            **Device:** ${{ env.SLUG || 'All available' }}

            ## Checklist
            - [ ] Review imported device definitions
            - [ ] Verify images render correctly
            - [ ] Update `bundledImages.ts` if needed
            - [ ] Run tests locally

            ---
            🤖 Generated by NetBox Import Action
          branch: import/${{ steps.validate.outputs.branch_name }}
          labels: feature,area:devices
