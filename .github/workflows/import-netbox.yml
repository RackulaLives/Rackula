name: Import NetBox Devices

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor name (case-sensitive, e.g., Ubiquiti, Dell, Synology)"
        required: true
        type: string
      slug:
        description: "Device slug to import (leave empty for all)"
        required: false
        type: string
      dry_run:
        description: "Dry run only (no changes)"
        required: false
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate inputs
        id: validate
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        run: |
          # Reject newline/CR so inputs cannot inject extra lines/commands, and enforce a
          # charset allowlist so shell metacharacters never reach the run: steps below,
          # mirroring build-lxc-dev.yml's "Validate label" step.
          case "$VENDOR" in
            *$'\n'*|*$'\r'*)
              echo "ERROR: vendor must not contain newline or CR characters"
              exit 1
              ;;
          esac
          case "$SLUG" in
            *$'\n'*|*$'\r'*)
              echo "ERROR: slug must not contain newline or CR characters"
              exit 1
              ;;
          esac

          # Vendor matches a NetBox devicetype-library folder name. Real folder
          # names include spaces and ampersands (e.g. "Allied Telesis", "Rohde
          # & Schwarz"), so the allowlist admits those. It must start and end
          # with a letter or digit, and must not contain "..".
          VENDOR_RE='^[A-Za-z0-9]([A-Za-z0-9 ._&-]*[A-Za-z0-9])?$'
          if [[ ! "$VENDOR" =~ $VENDOR_RE ]]; then
            echo "ERROR: vendor '$VENDOR' is invalid: must start and end with a letter or digit, and contain only letters, digits, spaces, and . _ & -"
            exit 1
          fi
          if [[ "$VENDOR" == *".."* ]]; then
            echo "ERROR: vendor '$VENDOR' is invalid: must not contain '..'"
            exit 1
          fi

          # Slug is a NetBox device slug: kebab-case, no spaces.
          SLUG_RE='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
          if [ -n "$SLUG" ]; then
            if [[ ! "$SLUG" =~ $SLUG_RE ]]; then
              echo "ERROR: slug '$SLUG' is invalid: must start and end with a letter or digit, and contain only letters, digits, and . _ -"
              exit 1
            fi
            if [[ "$SLUG" == *".."* ]]; then
              echo "ERROR: slug '$SLUG' is invalid: must not contain '..'"
              exit 1
            fi
          fi

          # Derive a safe, deterministic git branch identifier from vendor:
          # lowercase, collapse runs of non-alphanumerics to a single hyphen,
          # trim leading and trailing hyphens. The vendor validation above
          # guarantees this is never empty (vendor always starts and ends
          # with an alphanumeric).
          #
          # Two different vendor names can collapse to the same slug (e.g.
          # the real devicetype-library folders "ALLNET" and "Allnet" both
          # become "allnet"), which would make unrelated vendors share one
          # branch and PR. A short sha256 hash of the raw vendor is appended
          # to keep the id both readable and collision-free, and it stays
          # deterministic: the same vendor always hashes to the same id.
          VENDOR_SLUG=$(echo "$VENDOR" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          VENDOR_HASH=$(printf '%s' "$VENDOR" | sha256sum | cut -c1-8)
          VENDOR_ID="${VENDOR_SLUG}-${VENDOR_HASH}"

          # A single-device import (--slug) gets its own branch per device, so
          # concurrent imports for the same vendor don't combine into one PR.
          # An --all import keeps the existing vendor-level branch.
          if [ -n "$SLUG" ]; then
            DEVICE_SLUG=$(echo "$SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
            BRANCH_NAME="${VENDOR_ID}-${DEVICE_SLUG}"
          else
            BRANCH_NAME="${VENDOR_ID}-devices"
          fi
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        id: import
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--vendor "$VENDOR")

          if [ -n "$SLUG" ]; then
            ARGS+=(--slug "$SLUG")
          else
            ARGS+=(--all)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "Running: npx tsx scripts/import-netbox-devices.ts ${ARGS[*]}"
          npx tsx scripts/import-netbox-devices.ts "${ARGS[@]}"

      - name: Process images
        if: inputs.dry_run == false
        run: npm run process-images

      - name: Check for changes
        if: inputs.dry_run == false
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: inputs.dry_run == false && steps.changes.outputs.has_changes == 'true'
        env:
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(devices): import ${{ env.VENDOR }} devices from NetBox"
          title: "feat(devices): Import ${{ env.VENDOR }} devices from NetBox"
          body: |
            ## Summary
            Automated import of ${{ env.VENDOR }} devices from the NetBox devicetype-library.

            **Vendor:** ${{ env.VENDOR }}
            **Device:** ${{ env.SLUG || 'All available' }}

            ## Checklist
            - [ ] Review imported device definitions
            - [ ] Verify images render correctly
            - [ ] Update `bundledImages.ts` if needed
            - [ ] Run tests locally

            ---
            🤖 Generated by NetBox Import Action
          branch: import/${{ steps.validate.outputs.branch_name }}
          labels: feature,area:devices
