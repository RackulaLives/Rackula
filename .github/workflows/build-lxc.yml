name: Build LXC Tarball

# Builds the self-contained LXC tarball (frontend + API + config) and either
# uploads it to a published release or stores it as a workflow artifact for
# release-free branch testing.
#
# Two modes, controlled by the 'publish' input (workflow_dispatch only):
#
#   publish: true  (default) - release build
#     Requires a valid vYY.M.MICRO version tag. Checks out the tag and uploads
#     the tarball to the corresponding GitHub release. Called automatically by
#     release.yml, and manually via workflow_dispatch to backfill a tarball.
#
#   publish: false - artifact-only branch build
#     Checks out the given ref (defaults to the dispatched branch). Uses a
#     synthetic version label (inputs.version or vDEV-<sha>). Skips the publish
#     job entirely, so no release is created and deploy-prod is not triggered.
#     Download the artifact with: gh run download <run-id>
#
# Split into two jobs by privilege:
#   build   - contents: read. Checks out the ref and runs dependency code
#             (npm ci, bun install) with no write-capable token.
#   publish - contents: write. Downloads the build artifact and uploads it to
#             the release. Runs no repo/dependency code. Skipped when
#             publish=false or when a branch build is in progress.
on:
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g. v26.6.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag or label (e.g. v26.6.0). Leave blank for a branch build to use vDEV-<sha>."
        required: false
        type: string
      ref:
        description: "Branch or commit to build from. Only used when publish is false."
        required: false
        type: string
      publish:
        description: "Upload tarball to the GitHub release. Set to false for artifact-only branch builds."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Serialise per version/ref so concurrent dispatches cannot race on the same asset.
concurrency:
  group: build-lxc-${{ inputs.version || inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      # Resolve effective version, checkout ref, and artifact retention.
      # workflow_call always takes the release path (version required by caller).
      # workflow_dispatch with publish=false takes the branch path.
      - name: Resolve build config
        id: config
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_call" ] || [ "$INPUT_PUBLISH" != "false" ]; then
            VERSION="$INPUT_VERSION"
            if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: Version '$VERSION' does not match expected format vYY.M.MICRO (e.g. v26.6.0)"
              exit 1
            fi
            echo "checkout_ref=$VERSION" >> "$GITHUB_OUTPUT"
            echo "retention=1" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${SHA:0:7}"
            VERSION="${INPUT_VERSION:-vDEV-${SHORT_SHA}}"
            CHECKOUT_REF="${INPUT_REF:-${GITHUB_REF_NAME}}"
            echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
            echo "retention=7" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.config.outputs.checkout_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"

      - name: Build frontend
        env:
          VITE_ENV: production
          VITE_PERSIST_ENABLED: "true"
          VITE_UMAMI_ENABLED: "false"
        run: |
          npm ci
          npm run build

      - name: Install API production dependencies
        run: |
          cd api
          # The tarball is built on x86 but installs on any LXC arch (incl. arm64).
          # @node-rs/argon2 (the only native dep) ships per-platform binaries as
          # os/cpu-gated optional deps, so a normal host install pulls x64 only.
          # --cpu='*' --os=linux materialises every linux variant (x64 + arm64, gnu and
          # musl) in one production install, so the bundled node_modules runs on both
          # architectures. --production keeps devDependencies out of the tarball. The
          # runtime loader selects the binary by file presence, not the os/cpu manifest.
          bun install --frozen-lockfile --production --cpu='*' --os=linux

          # Fail the build if either native binary is missing.
          test -f node_modules/@node-rs/argon2-linux-x64-gnu/argon2.linux-x64-gnu.node
          test -f node_modules/@node-rs/argon2-linux-arm64-gnu/argon2.linux-arm64-gnu.node

      - name: Assemble tarball
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          TARBALL_DIR="rackula-lxc-${VERSION}"

          mkdir -p "${TARBALL_DIR}/frontend"
          mkdir -p "${TARBALL_DIR}/api"
          mkdir -p "${TARBALL_DIR}/config"

          # Frontend build output
          cp -r dist/* "${TARBALL_DIR}/frontend/"

          # API source + production deps (Bun runs TS natively)
          cp -r api/src "${TARBALL_DIR}/api/src"
          cp -r api/node_modules "${TARBALL_DIR}/api/node_modules"
          cp api/package.json "${TARBALL_DIR}/api/package.json"
          cp api/tsconfig.json "${TARBALL_DIR}/api/tsconfig.json"

          # LXC-specific config files
          cp deploy/lxc/nginx.conf "${TARBALL_DIR}/config/"
          cp deploy/lxc/rackula-api.service "${TARBALL_DIR}/config/"
          cp deploy/lxc/security-headers.conf "${TARBALL_DIR}/config/"
          cp deploy/lxc/nginx.service.d-override.conf "${TARBALL_DIR}/config/"

          # Verify expected directories exist in the tarball
          for dir in frontend api config; do
            if [ ! -d "${TARBALL_DIR}/${dir}" ] || [ -z "$(ls -A "${TARBALL_DIR}/${dir}")" ]; then
              echo "ERROR: Tarball directory '${dir}' is missing or empty"
              exit 1
            fi
          done

          tar czf "rackula-lxc-${VERSION}.tar.gz" "${TARBALL_DIR}"

          # Generate SHA256 checksum for integrity verification
          sha256sum "rackula-lxc-${VERSION}.tar.gz" > "rackula-lxc-${VERSION}.tar.gz.sha256"

          rm -rf "${TARBALL_DIR}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lxc-tarball
          path: |
            rackula-lxc-${{ steps.config.outputs.version }}.tar.gz
            rackula-lxc-${{ steps.config.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ steps.config.outputs.retention }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Skip when this is an artifact-only branch build (publish=false).
    # workflow_call always publishes; workflow_dispatch defaults to publish=true.
    if: github.event_name == 'workflow_call' || inputs.publish
    # contents: write is required only to upload the tarball and its checksum as
    # assets on the published release (gh release upload).
    permissions:
      contents: write

    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxc-tarball

      - name: Publish tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TARBALL="rackula-lxc-${VERSION}.tar.gz"

          # Guard against accidental corruption of the artifact in transit
          # between jobs. This is not tamper-proofing: the checksum travels in
          # the same artifact as the tarball, so it only catches truncation or
          # bit-rot, not a malicious swap.
          if ! sha256sum -c "${TARBALL}.sha256"; then
            echo "ERROR: SHA256 verification failed for ${TARBALL}"
            exit 1
          fi

          # Verify the release exists and is published (not a draft)
          IS_DRAFT=$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$IS_DRAFT" = "missing" ]; then
            echo "ERROR: Release $VERSION does not exist. Create it with release.yml first."
            exit 1
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "ERROR: Release $VERSION is a draft. Publish it before uploading tarballs."
            exit 1
          fi

          gh release upload "$VERSION" "${TARBALL}" "${TARBALL}.sha256" --clobber
          echo "Uploaded ${TARBALL} and checksum to release $VERSION"
