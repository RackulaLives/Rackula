name: Test Quality Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check test file sizes (pattern-based)
        run: |
          echo "Checking test file sizes with pattern-based limits..."
          FAILED=0

          # Helper function to check file size
          check_limit() {
            local file=$1
            local limit=$2
            local lines=$(wc -l < "$file")
            if [ "$lines" -gt "$limit" ]; then
              echo "❌ $file: $lines lines (exceeds $limit line limit)"
              return 1
            fi
            return 0
          }

          # Store tests: 2000 line limit (comprehensive core logic)
          echo "Checking store tests (limit: 2000 lines)..."
          for file in src/tests/*-store.test.ts; do
            [ -f "$file" ] || continue
            check_limit "$file" 2000 || FAILED=1
          done

          # Core algorithms: 1500 line limit (collision, schemas)
          echo "Checking core algorithm tests (limit: 1500 lines)..."
          for file in src/tests/collision*.test.ts src/tests/schemas.test.ts; do
            [ -f "$file" ] || continue
            check_limit "$file" 1500 || FAILED=1
          done

          # E2E tests: 1000 line limit (focused scenarios)
          echo "Checking E2E tests (limit: 1000 lines)..."
          for file in e2e/*.spec.ts; do
            [ -f "$file" ] || continue
            check_limit "$file" 1000 || FAILED=1
          done

          # All other tests: 500 line limit (should be small)
          echo "Checking other tests (limit: 500 lines)..."
          find src/tests -name "*.test.ts" ! -name "*-store.test.ts" ! -name "collision*.test.ts" ! -name "schemas.test.ts" | while read file; do
            check_limit "$file" 500 || FAILED=1
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Some test files exceed their size limits."
            echo "See CLAUDE.md 'Testing Rules (MANDATORY)' for guidance."
            exit 1
          else
            echo "✅ All test files are within size limits"
          fi

      - name: Check test:source ratio (tiered)
        run: |
          echo "Calculating test:source ratio..."
          TEST_LOC=$(find src/tests e2e -name "*.test.ts" -o -name "*.spec.ts" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          SRC_LOC=$(find src/lib -name "*.ts" -o -name "*.svelte" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "1")

          echo "Test LOC: $TEST_LOC"
          echo "Source LOC: $SRC_LOC"

          # Calculate ratio (multiply by 100 to avoid floating point)
          RATIO_X100=$(echo "scale=0; ($TEST_LOC * 100) / $SRC_LOC" | bc)
          RATIO=$(echo "scale=2; $TEST_LOC / $SRC_LOC" | bc)

          echo "Ratio: ${RATIO}:1 (${RATIO_X100}%)"

          # Tiered thresholds: warn at 60%, block at 80%
          if [ "$RATIO_X100" -gt 80 ]; then
            echo ""
            echo "❌ BLOCKED: Test:source ratio ${RATIO}:1 exceeds hard limit of 0.80:1"
            echo ""
            echo "This indicates significant over-testing."
            echo "See CLAUDE.md 'Testing Rules (MANDATORY)' for guidance."
            exit 1
          elif [ "$RATIO_X100" -gt 60 ]; then
            echo ""
            echo "⚠️ WARNING: Test:source ratio ${RATIO}:1 exceeds soft limit of 0.60:1"
            echo ""
            echo "Consider reviewing test value before merging."
            echo "This is a warning only - PR will not be blocked."
            echo "See CLAUDE.md 'Testing Rules (MANDATORY)' for guidance."
            # Don't exit 1 - just warn
          else
            echo "✅ Test:source ratio ${RATIO}:1 is healthy (warn: 0.60:1, block: 0.80:1)"
          fi

      - name: Update test metrics file
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Updating docs/test-metrics.md..."

          # Count files
          UNIT_TESTS=$(find src/tests -name "*.test.ts" | wc -l | tr -d ' ')
          E2E_TESTS=$(find e2e -name "*.spec.ts" | wc -l | tr -d ' ')
          TOTAL_TESTS=$((UNIT_TESTS + E2E_TESTS))

          # Calculate LOC
          TEST_LOC=$(find src/tests e2e -name "*.test.ts" -o -name "*.spec.ts" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          SRC_LOC=$(find src/lib -name "*.ts" -o -name "*.svelte" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "1")
          RATIO=$(echo "scale=2; $TEST_LOC / $SRC_LOC" | bc)

          # Find largest files per category
          LARGEST_STORE=$(find src/tests -name "*-store.test.ts" -exec wc -l {} \; 2>/dev/null | sort -rn | head -1 | awk '{print $2" ("$1")"}' || echo "none")
          LARGEST_ALGO=$(find src/tests -name "collision*.test.ts" -o -name "schemas.test.ts" | xargs wc -l 2>/dev/null | sort -rn | head -1 | awk '{print $2" ("$1")"}' || echo "none")
          LARGEST_E2E=$(find e2e -name "*.spec.ts" -exec wc -l {} \; 2>/dev/null | sort -rn | head -1 | awk '{print $2" ("$1")"}' || echo "none")
          LARGEST_OTHER=$(find src/tests -name "*.test.ts" ! -name "*-store.test.ts" ! -name "collision*.test.ts" ! -name "schemas.test.ts" -exec wc -l {} \; 2>/dev/null | sort -rn | head -1 | awk '{print $2" ("$1")"}' || echo "none")

          # Get commit hash and date
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Create metrics file
          cat > docs/test-metrics.md << EOF
          # Test Suite Metrics

          Last updated: $COMMIT_DATE (commit \`$COMMIT_HASH\`)

          ## Current State

          | Metric | Value | Status |
          |--------|-------|--------|
          | Unit test files | $UNIT_TESTS | ✅ |
          | E2E test files | $E2E_TESTS | ✅ |
          | Total test files | $TOTAL_TESTS | ✅ |
          | Test LOC | $TEST_LOC | ✅ |
          | Source LOC | $SRC_LOC | - |
          | Ratio | ${RATIO}:1 | $([ "$(echo "$RATIO * 100 > 60" | bc)" -eq 1 ] && echo "⚠️" || echo "✅") (warn: 0.60, block: 0.80) |

          ## File Size Check

          | Category | Largest File | Limit | Status |
          |----------|--------------|-------|--------|
          | Store tests | ${LARGEST_STORE:-none} | 2000 | ✅ |
          | Algorithm tests | ${LARGEST_ALGO:-none} | 1500 | ✅ |
          | E2E tests | ${LARGEST_E2E:-none} | 1000 | ✅ |
          | Other tests | ${LARGEST_OTHER:-none} | 500 | ✅ |

          ## History

          View trends over time:
          \`\`\`bash
          git log --oneline -p docs/test-metrics.md
          \`\`\`

          ## Guardrails

          **Hard blocks (ESLint):**
          - \`querySelector()\` / DOM node access in tests
          - \`toHaveClass()\` assertions
          - \`toHaveLength(literal)\` exact length assertions
          - Hardcoded color assertions

          **Soft limits (CI):**
          - Ratio > 0.60:1 → Warning in CI logs
          - Ratio > 0.80:1 → Hard block

          **File size limits (pattern-based):**
          | Pattern | Limit |
          |---------|-------|
          | \`*-store.test.ts\` | 2000 lines |
          | \`collision*.test.ts\`, \`schemas.test.ts\` | 1500 lines |
          | \`e2e/*.spec.ts\` | 1000 lines |
          | Other \`*.test.ts\` | 500 lines |

          See [CLAUDE.md - Testing Rules (MANDATORY)](../CLAUDE.md#testing-rules-mandatory) for full guidelines.
          EOF

          # Commit if changed
          if ! git diff --quiet docs/test-metrics.md 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/test-metrics.md
            git commit -m "chore: update test metrics [skip ci]"
            git push
          else
            echo "No changes to test metrics"
          fi
