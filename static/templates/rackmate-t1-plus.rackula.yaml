metadata:
  id: "a1b2c3d4-1001-4001-8001-000000000001"
  name: "RackMate T1 Plus"
  schema_version: "1.0"
  description: "An 8U 10-inch DeskPi RackMate T1 Plus concept with an MS-02 Ultra shelf candidate and three Lenovo Tiny mounts."
version: "1.0.0"
name: "RackMate T1 Plus"
racks:
  - id: "rack-rackmate-t1-plus"
    name: "RackMate T1 Plus"
    height: 8
    width: 10
    depth_mm: 260
    desc_units: false
    show_rear: true
    form_factor: "4-post-cabinet"
    starting_unit: 1
    position: 0
    notes: "DeskPi T1 Plus 8U 10-inch rack. Physical fit metadata is provisional until measured."
    devices:
      - id: "dev-cable-entry-u1"
        device_type: "rackmate-1u-cable-entry"
        name: "Cable Entry / Service Space"
        position: 6
        face: "front"
      - id: "dev-ms02-shelf-u2"
        device_type: "rackmate-ms02-3u-shelf"
        name: "MS-02 Ultra Shelf Candidate"
        position: 12
        face: "front"
        custom_fields:
          rackula_fit:
            status: "needs_measurement"
            concern: "Confirm width, cable bend, side airflow, and shelf load before treating this as build-ready."
      - id: "dev-ms02-ultra"
        device_type: "minisforum-ms02-ultra"
        name: "MS-02 Ultra"
        position: 0
        face: "front"
        container_id: "dev-ms02-shelf-u2"
        slot_id: "main"
        custom_fields:
          rackula_fit:
            status: "needs_measurement"
            orientation: "front-facing in 3U shelf"
      - id: "dev-tiny-mount-u5"
        device_type: "rackmate-tiny-1u-mount"
        name: "Tiny Mount 1"
        position: 30
        face: "front"
      - id: "dev-m720q-1"
        device_type: "lenovo-thinkcentre-m720q-tiny"
        name: "M720q Tiny 1"
        position: 0
        face: "front"
        container_id: "dev-tiny-mount-u5"
        slot_id: "main"
      - id: "dev-tiny-mount-u6"
        device_type: "rackmate-tiny-1u-mount"
        name: "Tiny Mount 2"
        position: 36
        face: "front"
      - id: "dev-m720q-2"
        device_type: "lenovo-thinkcentre-m720q-tiny"
        name: "Future M720q Tiny 2"
        position: 0
        face: "front"
        container_id: "dev-tiny-mount-u6"
        slot_id: "main"
        custom_fields:
          rackula_fit:
            status: "planned"
      - id: "dev-tiny-mount-u7"
        device_type: "rackmate-tiny-1u-mount"
        name: "Tiny Mount 3"
        position: 42
        face: "front"
      - id: "dev-m720q-3"
        device_type: "lenovo-thinkcentre-m720q-tiny"
        name: "Future M720q Tiny 3"
        position: 0
        face: "front"
        container_id: "dev-tiny-mount-u7"
        slot_id: "main"
        custom_fields:
          rackula_fit:
