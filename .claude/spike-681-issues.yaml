issues:
  - title: "feat: add faceFilter prop to AnnotationColumn"
    type: feature
    labels:
      - feature
      - area:canvas
      - size:small
    body: |
      ## Summary

      Add a `faceFilter` prop to `AnnotationColumn` that filters displayed devices by their face (front/rear). This is required for bayed rack annotations where each row only shows devices on that face.

      ## Acceptance Criteria

      - [ ] Add `faceFilter?: "front" | "rear"` prop to AnnotationColumn
      - [ ] Filter `annotations` derived value to only include devices matching the filter
      - [ ] When `faceFilter` is undefined, show all devices (backward compatible)

      ## Technical Notes

      The filtering logic should be:
      ```typescript
      const filteredDevices = $derived(
        faceFilter
          ? rack.devices.filter(d => d.face === faceFilter)
          : rack.devices
      );
      ```

      ## Related

      - Spike: #681

  - title: "feat: implement per-bay annotations for bayed racks"
    type: feature
    labels:
      - feature
      - area:canvas
      - size:medium
    body: |
      ## Summary

      Implement per-bay annotation columns for bayed racks. Each bay should have its own annotation column positioned adjacent to it, with front row annotations on the left and rear row annotations on the right (mirrored).

      ## Acceptance Criteria

      - [ ] Wire up existing `showAnnotations` and `annotationField` props in BayedRackView
      - [ ] Front row: render AnnotationColumn LEFT of each bay
      - [ ] Rear row: render AnnotationColumn RIGHT of each bay (mirrored)
      - [ ] Pass appropriate `faceFilter` to each annotation column
      - [ ] Annotations align vertically with device U positions

      ## Technical Notes

      Layout structure:
      ```
      FRONT: [U-labels] [Ann1][Bay1] [Ann2][Bay2] ...
      REAR:  ... [Bay2][Ann2] [Bay1][Ann1] [U-labels]
      ```

      Consider creating a `BayedBayContainer` wrapper component for cleaner code organization.

      ## Related

      - Spike: #681
      - Depends on: faceFilter prop issue

  - title: "feat: add compact width option for bayed rack annotations"
    type: feature
    labels:
      - feature
      - area:canvas
      - size:small
    body: |
      ## Summary

      Bayed racks can be quite wide with multiple bays. Using the full 100px annotation width for each bay may cause horizontal overflow. Add support for narrower annotation columns (e.g., 80px) with adjusted text truncation.

      ## Acceptance Criteria

      - [ ] BayedRackView uses narrower annotation width (80px) by default
      - [ ] Truncation threshold adjusted for narrower columns
      - [ ] Text remains legible at the narrower width
      - [ ] Optional: smaller font size for compact mode

      ## Technical Notes

      The `width` prop already exists on AnnotationColumn. This issue is about:
      1. Setting appropriate default for bayed racks
      2. Adjusting `truncate()` function's `maxLength` parameter
      3. Possibly adding a font size variant

      ## Related

      - Spike: #681
      - Depends on: per-bay annotations issue

