# yaml-language-server: $schema=https://count.racku.la/schemas/rackula-layout.schema.json
metadata:
  id: 6c1f8a2d-9b3e-4f7a-8d1c-3a5e9b7f2c44
  name: AV Connectivity Rack
  schema_version: "1.0"
version: "26.7.0"
name: AV Connectivity Rack
racks:
  - id: rack-av
    name: AV Rack
    height: 12
    width: 19
    desc_units: false
    show_rear: true
    form_factor: 4-post-cabinet
    starting_unit: 1
    position: 0
    devices:
      - id: dev-av-processor
        device_type: av-control-processor-2u
        position: 6
        face: front
        ports:
          - id: port-xlr5
            template_name: Mic In (5-pin)
            template_index: 0
            type: xlr-5
          - id: port-speakon
            template_name: Speaker Out
            template_index: 1
            type: speakon
          - id: port-phoenix
            template_name: Amp Terminal
            template_index: 2
            type: phoenix
          - id: port-hdmi
            template_name: HDMI In
            template_index: 3
            type: hdmi
          - id: port-dp
            template_name: DisplayPort In
            template_index: 4
            type: displayport
          - id: port-sdi
            template_name: SDI Out
            template_index: 5
            type: sdi-bnc
          - id: port-vga
            template_name: VGA In
            template_index: 6
            type: vga
          - id: port-dmx
            template_name: DMX Out
            template_index: 7
            type: dmx-xlr
          - id: port-rs232
            template_name: RS-232 Control
            template_index: 8
            type: rs-232
          - id: port-rs422
            template_name: RS-422 Control
            template_index: 9
            type: rs-422
          - id: port-dante
            template_name: Dante Primary
            template_index: 10
            type: dante
          - id: port-avb
            template_name: AVB Link
            template_index: 11
            type: avb
          - id: port-aes3
            template_name: AES3 Digital
            template_index: 12
            type: aes3
device_types:
  - slug: av-control-processor-2u
    manufacturer: Acme AV
    model: Control Processor 2U
    u_height: 2
    colour: "#BD93F9"
    category: av-media
    interfaces:
      - name: Mic In (5-pin)
        type: xlr-5
      - name: Speaker Out
        type: speakon
      - name: Amp Terminal
        type: phoenix
      - name: HDMI In
        type: hdmi
      - name: DisplayPort In
        type: displayport
      - name: SDI Out
        type: sdi-bnc
      - name: VGA In
        type: vga
      - name: DMX Out
        type: dmx-xlr
      - name: RS-232 Control
        type: rs-232
      - name: RS-422 Control
        type: rs-422
      - name: Dante Primary
        type: dante
      - name: AVB Link
        type: avb
      - name: AES3 Digital
        type: aes3
settings:
  display_mode: label
  show_labels_on_images: false
