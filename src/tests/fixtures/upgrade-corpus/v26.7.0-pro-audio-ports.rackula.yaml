    name: Studio Rack
    height: 12
    width: 19
    desc_units: false
    show_rear: true
    form_factor: 4-post-cabinet
    starting_unit: 1
    position: 0
    devices:
      - id: dev-audio-if
        device_type: audio-interface-1u
        position: 6
        face: front
        ports:
          - id: port-mic-in
            template_name: Mic In
            template_index: 0
            type: xlr-3
          - id: port-line-out
            template_name: Line Out
            template_index: 1
            type: trs-1-4
          - id: port-inst-in
            template_name: Inst In
            template_index: 2
            type: ts-1-4
          - id: port-monitor
            template_name: Monitor
            template_index: 3
            type: rca
          - id: port-adat
            template_name: ADAT
            template_index: 4
            type: adat-optical
          - id: port-midi
            template_name: MIDI In
            template_index: 5
            type: midi-din
          - id: port-wordclock
            template_name: Word Clock
            template_index: 6
            type: bnc
          - id: port-dsub
            template_name: Analog 8ch
            template_index: 7
            type: db25-audio
device_types:
  - slug: audio-interface-1u
    manufacturer: Acme Audio
    model: Interface 1U
    u_height: 1
    colour: "#8BE9FD"
    category: av-media
    interfaces:
      - name: Mic In
        type: xlr-3
      - name: Line Out
        type: trs-1-4
      - name: Inst In
        type: ts-1-4
      - name: Monitor
        type: rca
      - name: ADAT
        type: adat-optical
      - name: MIDI In
        type: midi-din
      - name: Word Clock
        type: bnc
      - name: Analog 8ch
        type: db25-audio
settings:
  display_mode: label
  show_labels_on_images: false
