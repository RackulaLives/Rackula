# yaml-language-server: $schema=https://count.racku.la/schemas/rackula-layout.schema.json
metadata:
  id: 3f2a91c4-7d6e-4b1a-9c8f-2e5d7a0b1c33
  name: Pro Audio Rack
  schema_version: "1.0"
version: "26.7.0"
name: Pro Audio Rack
racks:
